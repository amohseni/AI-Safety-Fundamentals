# Runs the numerical tests behind the claims in the page text (tools/test-*.mjs).
# The numerical tests need Node only. tools/test-shell.mjs and tools/check.mjs need a browser,
# so the jobs install Playwright with Chromium first.
name: test

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  fast:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright with Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node tools/run-tests.mjs --fast
      - name: Browser check of every page at desktop and phone width
        run: node tools/check.mjs

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright with Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node tools/run-tests.mjs
      - run: node tools/check.mjs
